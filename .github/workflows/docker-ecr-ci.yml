name: ShopVerse Build Publish and Frontend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: shopverse-main-deploy
  cancel-in-progress: false

jobs:
  frontend-deploy:
    name: Deploy Storefront to S3 and CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Untitled/package-lock.json

      - name: Install storefront dependencies
        run: npm ci --prefix Untitled

      - name: Build storefront
        run: npm run build --prefix Untitled

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload storefront to private S3 bucket
        run: aws s3 sync Untitled/dist/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

  backend-deploy:
    name: Test and Deploy Backend to Live EC2 PM2 Server
    runs-on: ubuntu-latest
    needs: frontend-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Test backend API contract
        run: npm test --prefix backend

      - name: Copy backend release to live EC2 server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: backend/*
          target: /tmp/shopverse-backend-release
          strip_components: 1
          overwrite: true
          rm: true

      - name: Deploy backend to live EC2 PM2 server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            app_dir=/home/ubuntu/shopverse-backend
            release_dir=/tmp/shopverse-backend-release
            backup_dir="/home/ubuntu/shopverse-backend-backup-$(date +%Y%m%d-%H%M%S)"

            test -f "$release_dir/server.js"
            test -f "$release_dir/package-lock.json"
            test -f "$app_dir/.env"

            echo "Backup current backend"
            mkdir -p "$backup_dir"
            cp -R "$app_dir"/. "$backup_dir"/

            echo "Install backend release"
            cp -R "$release_dir"/. "$app_dir"/
            cd "$app_dir"
            npm ci --omit=dev
            node --check server.js

            echo "Restart PM2 backend"
            pm2 restart shopverse-backend || pm2 start server.js --name shopverse-backend
            pm2 save

            echo "Check backend health"
            sleep 2
            curl --fail --silent --show-error http://127.0.0.1:5001/api/health

            echo "Backend deploy completed"
            pm2 list

  database-migration-review:
    name: Review Database Migration Files
    runs-on: ubuntu-latest
    needs: backend-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect SQL migrations
        run: |
          MIGRATIONS=$(find migrations backend/migrations -type f -name '*.sql' -print 2>/dev/null | sort)
          if [ -z "$MIGRATIONS" ]; then
            echo "No SQL migration files detected."
            exit 0
          fi

          echo "SQL migration files require a database backup and manual review:"
          echo "$MIGRATIONS"
          echo "Automatic SQL execution is intentionally disabled."
