name: ShopVerse Build Publish and Frontend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: shopverse-main-deploy
  cancel-in-progress: false

jobs:
  frontend-deploy:
    name: Deploy Storefront to S3 and CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Untitled/package-lock.json

      - name: Install storefront dependencies
        run: npm ci --prefix Untitled

      - name: Build storefront
        run: npm run build --prefix Untitled

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload storefront to private S3 bucket
        run: aws s3 sync Untitled/dist/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

  backend-image-publish:
    name: Build and Push Backend Candidate Image
    runs-on: ubuntu-latest
    needs: frontend-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend project
        run: npm run lint

      - name: Build backend project
        run: npm run build

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend candidate image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPOSITORY:latest" .
          docker tag "$ECR_REPOSITORY:latest" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag "$ECR_REPOSITORY:latest" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Explain EC2 deployment gate
        run: |
          echo "Backend candidate image published to ECR."
          echo "EC2 auto-restart remains disabled until this repository contains the production API source."

  database-migration-review:
    name: Review Database Migration Files
    runs-on: ubuntu-latest
    needs: backend-image-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect SQL migrations
        run: |
          MIGRATIONS=$(find migrations -type f -name '*.sql' -print | sort)
          if [ -z "$MIGRATIONS" ]; then
            echo "No SQL migration files detected."
            exit 0
          fi

          echo "SQL migration files require a database backup and manual review:"
          echo "$MIGRATIONS"
          echo "Automatic SQL execution is intentionally disabled."
