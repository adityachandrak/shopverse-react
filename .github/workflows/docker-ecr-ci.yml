name: ShopVerse Build Publish and Frontend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: shopverse-main-deploy
  cancel-in-progress: false

jobs:
  frontend-deploy:
    name: Deploy Storefront to S3 and CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Untitled/package-lock.json

      - name: Install storefront dependencies
        run: npm ci --prefix Untitled

      - name: Build storefront
        run: npm run build --prefix Untitled

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload storefront to private S3 bucket
        run: aws s3 sync Untitled/dist/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

  backend-deploy:
    name: Test Publish and Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: frontend-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Test backend API contract
        run: npm test --prefix backend

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPOSITORY:latest" ./backend
          docker tag "$ECR_REPOSITORY:latest" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker tag "$ECR_REPOSITORY:latest" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy immutable backend image through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SCRIPT_BASE64=$(base64 --wrap=0 scripts/deploy-backend.sh)
          DEPLOY_COMMAND="/tmp/deploy-shopverse-backend.sh '$ECR_REGISTRY' '$ECR_REPOSITORY' '$IMAGE_TAG' '$AWS_REGION'"

          jq --null-input \
            --arg script "$SCRIPT_BASE64" \
            --arg deploy "$DEPLOY_COMMAND" \
            '{
              commands: [
                ("echo " + $script + " | base64 --decode > /tmp/deploy-shopverse-backend.sh"),
                "chmod 700 /tmp/deploy-shopverse-backend.sh",
                $deploy
              ]
            }' > /tmp/ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ShopVerse backend $IMAGE_TAG" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

  database-migration-review:
    name: Review Database Migration Files
    runs-on: ubuntu-latest
    needs: backend-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect SQL migrations
        run: |
          MIGRATIONS=$(find migrations -type f -name '*.sql' -print | sort)
          if [ -z "$MIGRATIONS" ]; then
            echo "No SQL migration files detected."
            exit 0
          fi

          echo "SQL migration files require a database backup and manual review:"
          echo "$MIGRATIONS"
          echo "Automatic SQL execution is intentionally disabled."
